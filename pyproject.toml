[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "ai-cybersecurity-assistant"
version = "1.0.0"
description = "AI-Powered Network Scanning Assistant"
requires-python = ">=3.11"
dependencies = [
    "rich>=13.0.0",
    "flask>=3.0.0",
    "google-generativeai>=0.4.0",
    "python-dotenv>=1.0.0",
    "Flask-APScheduler>=1.12.4",
    "python-whois>=0.8.0",
    "dnspython>=2.0.0",
    "requests>=2.0.0"
]

[tool.setuptools]
py-modules = ["app", "cli", "db", "utils"]
