# Daily threat brief. Stdlib Python only: no pip install and no API key.
# Schedule is once a day. It does not run on every push, to save Actions minutes.
name: Threat brief

on:
  schedule:
    - cron: "15 4 * * *"
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: threat-brief
  cancel-in-progress: false

jobs:
  brief:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Collect public feeds
        run: python3 threat-brief/collect.py

      - name: Commit updated data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add threat-brief/site/data/brief.json threat-brief/site/data/catalog.json
          if git diff --staged --quiet; then
            echo "No data change."
          else
            git commit -m "chore: refresh security threat brief data"
            git push
          fi

      - name: Upload GitHub Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: threat-brief/site

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
